<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c0f">
<title>AI Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0c0f;--surface:#111318;--border:#1e2229;--gold:#f5c842;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b;--text:#e5e7eb;--text-dim:#6b7280;--muted:#4b5563;--mono:'DM Mono',monospace;--display:'Syne',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--display);min-height:100vh;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-size:16px;font-weight:700}
.logo-sub{font-size:10px;color:var(--text-dim);font-family:var(--mono);margin-top:1px}
.badge{background:#1a1f0a;border:1px solid #3a4a10;color:#a3e635;font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:4px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--border)}
.tab{flex:1;padding:8px;font-size:12px;font-family:var(--mono);border:none;background:transparent;color:var(--text-dim);cursor:pointer;border-radius:7px;transition:all .2s}
.tab.active{background:var(--border);color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stat-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.stat-badge{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:99px}
.stat-num{font-size:28px;font-weight:500;font-family:var(--mono);line-height:1;margin-bottom:3px}
.stat-label{font-size:10px;color:var(--text-dim);font-family:var(--mono)}
.stat-divider{height:1px;background:var(--border);margin:8px 0}
.stat-foot{font-size:10px;color:var(--muted);font-family:var(--mono)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.panel-title{font-size:10px;font-family:var(--mono);color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.trade-item{padding:10px 0;border-bottom:1px solid var(--border)}
.trade-item:last-child{border-bottom:none;padding-bottom:0}
.trade-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.signal-buy{color:var(--green);font-weight:500;font-size:13px;font-family:var(--mono)}
.signal-sell{color:var(--red);font-weight:500;font-size:13px;font-family:var(--mono)}
.pill{font-size:10px;padding:2px 7px;border-radius:3px;font-family:var(--mono)}
.pill-exec{background:#052e16;color:var(--green);border:1px solid #166534}
.pill-rej{background:#1f0707;color:#f87171;border:1px solid #7f1d1d}
.pill-win{background:#052e16;color:var(--green);border:1px solid #166534}
.pill-loss{background:#1f0707;color:#f87171;border:1px solid #7f1d1d}
.pill-timeout{background:#1a1f0a;color:#a3e635;border:1px solid #3a4a10}
.trade-details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:10px;font-family:var(--mono);color:var(--text-dim)}
.trade-details span{display:flex;flex-direction:column;gap:1px}
.trade-details b{color:var(--text);font-weight:500}
.conf-bar{height:2px;border-radius:1px;background:var(--border);margin-top:6px}
.conf-fill{height:100%;border-radius:1px;background:var(--gold)}
.rej-reason{font-size:10px;color:#f87171;background:#1f0707;padding:4px 8px;border-radius:3px;margin-top:6px;font-family:var(--mono)}
.chart-wrap{height:180px;margin-top:4px}
.chart-wrap-sm{height:140px;margin-top:4px}
.debate-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:11px;font-family:var(--mono);border-bottom:1px solid var(--border)}
.debate-item:last-child{border-bottom:none}
.dot{width:5px;height:5px;border-radius:50%;margin-top:4px;flex-shrink:0}
.last-update{font-size:10px;color:var(--muted);font-family:var(--mono);text-align:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.section-hidden{display:none}
.bt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bt-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;font-family:var(--mono)}
.bt-row:last-child{border-bottom:none}
.monthly-bar{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:10px;font-family:var(--mono);border-bottom:1px solid var(--border)}
.monthly-bar:last-child{border-bottom:none}
.bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-text">AI Trading</div>
      <div class="logo-sub">XAUUSD · phase 4 · eightcap</div>
    </div>
  </div>
  <span class="badge" id="mode-badge">● PAPER</span>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('live')">Live Trades</button>
  <button class="tab" onclick="switchTab('backtest')">Backtest 2Y</button>
</div>

<!-- LIVE TRADES SECTION -->
<div id="tab-live">
  <div class="stats-grid" id="live-stats"></div>
  <div class="panel">
    <div class="panel-title">trade log</div>
    <div id="trade-list"></div>
  </div>
  <div class="panel">
    <div class="panel-title">confidence per run</div>
    <div class="chart-wrap"><canvas id="confChart"></canvas></div>
  </div>
  <div class="panel">
    <div class="panel-title">latest debate</div>
    <div id="debate-list"></div>
  </div>
</div>

<!-- BACKTEST SECTION -->
<div id="tab-backtest" class="section-hidden">
  <div class="stats-grid" id="bt-stats"></div>
  <div class="bt-grid">
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title">performance</div>
      <div id="bt-perf"></div>
    </div>
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title">risk metrics</div>
      <div id="bt-risk"></div>
    </div>
  </div>
  <div class="panel" style="margin-top:12px">
    <div class="panel-title">equity curve — 2 years</div>
    <div class="chart-wrap"><canvas id="equityChart"></canvas></div>
  </div>
  <div class="panel">
    <div class="panel-title">monthly P&L</div>
    <div id="monthly-list"></div>
  </div>
  <div class="panel">
    <div class="panel-title">backtest trades (last 20)</div>
    <div id="bt-trades"></div>
  </div>
</div>

<div class="last-update" id="last-update"></div>

<script>
const BACKTEST = {"summary":{"total_trades":82,"win_rate":40.2,"total_pnl":277.11,"final_balance":1277.11,"max_drawdown":304.19,"profit_factor":1.45,"sharpe_ratio":3.28,"avg_win":22.05,"avg_loss":-11.12,"best_trade":25.38,"worst_trade":-12.94,"account_start":1000.0,"return_pct":27.7},"equity_labels":["06-07","07-01","07-16","07-17","07-18","08-12","08-16","08-30","09-04","09-05","10-03","10-15","10-16","10-17","10-25","11-08","11-12","11-28","12-13","12-16","12-24","01-02","01-13","01-15","02-06","02-12","02-20","03-03","03-04","03-10","03-14","03-31","04-09","04-28","05-02","05-06","05-15","05-16","05-28","05-29","06-06","06-11","06-12","06-25","07-03","07-21","07-22","07-29","08-06","08-15","08-18","08-21","09-05","09-08","09-22","10-15","10-22","10-30","11-13","11-19","12-03","12-15","12-29","01-13","01-15","01-29","02-02","02-03","02-09","02-10","02-11","02-20","03-04","03-13","03-24","03-30","03-31","04-06","04-09","04-16","04-23","05-01","05-07"],"equity_values":[1000.0,1020.0,1009.8,999.7,989.7,1009.5,1029.7,1050.3,1039.8,1029.4,1049.98,1039.48,1029.09,1018.8,1008.61,1028.79,1018.5,1038.88,1028.49,1018.21,1038.57,1059.35,1048.76,1038.27,1027.89,1048.45,1069.41,1090.79,1112.61,1101.48,1090.47,1079.57,1101.17,1090.16,1111.96,1100.84,1089.83,1078.93,1068.14,1057.46,1078.6,1067.81,1057.13,1046.56,1067.5,1088.86,1110.64,1099.53,1088.53,1110.1,1132.3,1120.98,1109.77,1098.67,1120.65,1143.07,1165.93,1154.27,1173.68,1197.16,1185.19,1208.89,1196.8,1184.83,1172.98,1196.44,1220.36,1244.76,1232.31,1219.99,1207.79,1231.95,1219.63,1207.43,1231.57,1219.25,1243.63,1268.51,1293.89,1280.95,1268.14,1262.4,1277.11],"monthly":{"2024-07":{"wins":1,"losses":3,"pnl":-10.3},"2024-08":{"wins":3,"losses":0,"pnl":60.6},"2024-09":{"wins":0,"losses":2,"pnl":-20.9},"2024-10":{"wins":1,"losses":4,"pnl":-20.79},"2024-11":{"wins":2,"losses":1,"pnl":30.27},"2024-12":{"wins":1,"losses":2,"pnl":-0.31},"2025-01":{"wins":1,"losses":2,"pnl":-0.3},"2025-02":{"wins":2,"losses":1,"pnl":31.14},"2025-03":{"wins":2,"losses":3,"pnl":10.16},"2025-04":{"wins":1,"losses":1,"pnl":10.59},"2025-05":{"wins":1,"losses":5,"pnl":-32.7},"2025-06":{"wins":1,"losses":3,"pnl":-10.9},"2025-07":{"wins":3,"losses":1,"pnl":52.97},"2025-08":{"wins":1,"losses":2,"pnl":21.45},"2025-09":{"wins":1,"losses":2,"pnl":-0.33},"2025-10":{"wins":2,"losses":1,"pnl":33.62},"2025-11":{"wins":1,"losses":0,"pnl":42.89},"2025-12":{"wins":1,"losses":2,"pnl":-0.36},"2026-01":{"wins":1,"losses":2,"pnl":-0.36},"2026-02":{"wins":3,"losses":3,"pnl":35.51},"2026-03":{"wins":2,"losses":3,"pnl":11.68},"2026-04":{"wins":2,"losses":2,"pnl":24.51},"2026-05":{"wins":0,"losses":0,"pnl":8.97}}};

let liveData = [];
let charts = {};

async function loadLive() {
  try {
    const res = await fetch('./paper_trades.json?t=' + Date.now());
    if (!res.ok) throw new Error('Cannot load paper_trades.json');
    liveData = await res.json();
    renderLive(liveData);
  } catch(e) {
    document.getElementById('trade-list').innerHTML = '<div style="color:#f87171;font-size:11px;font-family:var(--mono)">Error: ' + e.message + '</div>';
  }
}

function renderLive(T) {
  if (!T.length) return;
  const exec = T.filter(t=>t.executed).length;
  const rej = T.length - exec;
  const avgConf = Math.round(T.reduce((a,t)=>a+t.confidence,0)/T.length);
  const totalTok = T.reduce((a,t)=>a+(t.total_tokens||0),0);
  const sellCount = T.filter(t=>t.signal==='SELL').length;

  document.getElementById('mode-badge').textContent = '● ' + (T[T.length-1]?.mode||'paper').toUpperCase();

  const stats = [
    {icon:'⚡',label:'total runs',value:T.length,sub:'paper trade',ibg:'#1a1a2e',ic:'#6b7280',bbg:'#1e2229',bc:'#4b5563',badge:'today'},
    {icon:'✓',label:'executed',value:exec,sub:'passed gate',ibg:'#052e16',ic:'#22c55e',bbg:'#052e16',bc:'#22c55e',badge:Math.round(exec/T.length*100)+'%',vc:'#22c55e'},
    {icon:'✕',label:'rejected',value:rej,sub:'filtered',ibg:'#1f0707',ic:'#ef4444',bbg:'#1f0707',bc:'#ef4444',badge:Math.round(rej/T.length*100)+'%',vc:'#ef4444'},
    {icon:'~',label:'avg conf',value:avgConf+'%',sub:'all runs',ibg:'#2a1f05',ic:'#f59e0b',bbg:'#2a1f05',bc:'#f59e0b',badge:'avg',vc:'#f59e0b'},
    {icon:'#',label:'tokens',value:(totalTok/1000).toFixed(0)+'k',sub:'total used',ibg:'#0c1a2e',ic:'#3b82f6',bbg:'#0c1a2e',bc:'#3b82f6',badge:'~$'+(totalTok*0.000003).toFixed(4),vc:'#3b82f6'},
    {icon:'↓',label:'top signal',value:'SELL',sub:sellCount+'/'+T.length+' runs',ibg:'#1a1a1a',ic:'#6b7280',bbg:'#1e2229',bc:'#4b5563',badge:sellCount+'/'+T.length},
  ];
  document.getElementById('live-stats').innerHTML = stats.map(s=>`
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon" style="background:${s.ibg};color:${s.ic};font-family:var(--mono)">${s.icon}</div>
        <span class="stat-badge" style="background:${s.bbg};color:${s.bc}">${s.badge}</span>
      </div>
      <div class="stat-num" style="${s.vc?'color:'+s.vc:''}">${s.value}</div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-divider"></div>
      <div class="stat-foot">${s.sub}</div>
    </div>`).join('');

  document.getElementById('trade-list').innerHTML = [...T].reverse().map(t=>`
    <div class="trade-item">
      <div class="trade-top">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="${t.signal==='BUY'?'signal-buy':'signal-sell'}">${t.signal}</span>
          <span style="font-size:10px;color:var(--text-dim);font-family:var(--mono)">${(t.timestamp||'').slice(0,16)}</span>
        </div>
        <span class="pill ${t.executed?'pill-exec':'pill-rej'}">${t.executed?'✓ EXEC':'✗ REJ'}</span>
      </div>
      <div class="trade-details">
        <span>entry<b>${(t.entry||0).toFixed(2)}</b></span>
        <span>SL<b style="color:#ef4444">${t.sl||'—'}</b></span>
        <span>TP<b style="color:#22c55e">${t.tp||'—'}</b></span>
      </div>
      <div class="conf-bar"><div class="conf-fill" style="width:${t.confidence||0}%"></div></div>
      ${!t.executed&&t.rejection_reasons?.length?`<div class="rej-reason">${t.rejection_reasons[0]}</div>`:''}
    </div>`).join('');

  if (charts.conf) charts.conf.destroy();
  charts.conf = new Chart(document.getElementById('confChart'),{
    type:'bar',
    data:{labels:T.map((_,i)=>'#'+(i+1)),datasets:[{data:T.map(t=>t.confidence),backgroundColor:T.map(t=>t.executed?'#22c55e33':'#ef444433'),borderColor:T.map(t=>t.executed?'#22c55e':'#ef4444'),borderWidth:1,borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:10}}},y:{min:0,max:100,grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:10}}}}}
  });

  const latest = T[T.length-1];
  if (latest) {
    document.getElementById('debate-list').innerHTML = [
      ...(latest.bull_points||[]).map(p=>`<div class="debate-item"><div class="dot" style="background:#22c55e"></div><div style="color:#86efac">${p}</div></div>`),
      ...(latest.bear_points||[]).map(p=>`<div class="debate-item"><div class="dot" style="background:#ef4444"></div><div style="color:#fca5a5">${p}</div></div>`)
    ].join('')||'<div style="color:var(--text-dim);font-size:11px;font-family:var(--mono)">no data</div>';
  }
  document.getElementById('last-update').textContent = 'updated: ' + new Date().toLocaleString('th-TH');
}

function renderBacktest() {
  const s = BACKTEST.summary;
  const isProfit = s.total_pnl >= 0;

  // Stats cards
  const btstats = [
    {icon:'↑',label:'return',value:s.return_pct+'%',sub:'2 years',ibg:'#052e16',ic:'#22c55e',bbg:'#052e16',bc:'#22c55e',badge:isProfit?'profit':'loss',vc:'#22c55e'},
    {icon:'%',label:'win rate',value:s.win_rate+'%',sub:s.total_trades+' trades',ibg:'#2a1f05',ic:'#f59e0b',bbg:'#2a1f05',bc:'#f59e0b',badge:'total',vc:'#f59e0b'},
    {icon:'$',label:'total P&L',value:'$'+s.total_pnl,sub:'from $'+s.account_start,ibg:isProfit?'#052e16':'#1f0707',ic:isProfit?'#22c55e':'#ef4444',bbg:isProfit?'#052e16':'#1f0707',bc:isProfit?'#22c55e':'#ef4444',badge:'net',vc:isProfit?'#22c55e':'#ef4444'},
    {icon:'▼',label:'max drawdown',value:'$'+s.max_drawdown,sub:'worst dip',ibg:'#1f0707',ic:'#ef4444',bbg:'#1f0707',bc:'#ef4444',badge:'dd',vc:'#ef4444'},
    {icon:'~',label:'profit factor',value:s.profit_factor,sub:'> 1.0 = good',ibg:'#0c1a2e',ic:'#3b82f6',bbg:'#0c1a2e',bc:'#3b82f6',badge:'pf',vc:'#3b82f6'},
    {icon:'S',label:'sharpe ratio',value:s.sharpe_ratio,sub:'> 1.0 = good',ibg:'#1a1a2e',ic:'#6b7280',bbg:'#1e2229',bc:'#4b5563',badge:'sr'},
  ];
  document.getElementById('bt-stats').innerHTML = btstats.map(s2=>`
    <div class="stat-card">
      <div class="stat-top">
        <div class="stat-icon" style="background:${s2.ibg};color:${s2.ic};font-family:var(--mono)">${s2.icon}</div>
        <span class="stat-badge" style="background:${s2.bbg};color:${s2.bc}">${s2.badge}</span>
      </div>
      <div class="stat-num" style="${s2.vc?'color:'+s2.vc:''}">${s2.value}</div>
      <div class="stat-label">${s2.label}</div>
      <div class="stat-divider"></div>
      <div class="stat-foot">${s2.sub}</div>
    </div>`).join('');

  // Performance table
  document.getElementById('bt-perf').innerHTML = [
    ['total trades', s.total_trades],
    ['win rate', s.win_rate+'%'],
    ['avg win', '$'+s.avg_win],
    ['best trade', '$'+s.best_trade],
    ['final balance', '$'+s.final_balance],
  ].map(([k,v])=>`<div class="bt-row"><span style="color:var(--text-dim)">${k}</span><span style="font-weight:500">${v}</span></div>`).join('');

  // Risk table
  document.getElementById('bt-risk').innerHTML = [
    ['max drawdown', '$'+s.max_drawdown],
    ['profit factor', s.profit_factor],
    ['sharpe ratio', s.sharpe_ratio],
    ['avg loss', '$'+s.avg_loss],
    ['worst trade', '$'+s.worst_trade],
  ].map(([k,v])=>`<div class="bt-row"><span style="color:var(--text-dim)">${k}</span><span style="font-weight:500">${v}</span></div>`).join('');

  // Equity curve chart
  if (charts.equity) charts.equity.destroy();
  charts.equity = new Chart(document.getElementById('equityChart'),{
    type:'line',
    data:{
      labels: BACKTEST.equity_labels,
      datasets:[{
        data: BACKTEST.equity_values,
        borderColor:'#f5c842',
        borderWidth:1.5,
        pointRadius:0,
        fill:true,
        backgroundColor:'rgba(245,200,66,0.05)',
        tension:0.3,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:9},maxTicksLimit:8}},
        y:{grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:9},callback:v=>'$'+v}}
      }
    }
  });

  // Monthly P&L bars
  const monthly = BACKTEST.monthly;
  const maxPnl = Math.max(...Object.values(monthly).map(m=>Math.abs(m.pnl)));
  document.getElementById('monthly-list').innerHTML = Object.entries(monthly).map(([month, m])=>`
    <div class="monthly-bar">
      <span style="min-width:56px;color:var(--text-dim)">${month.slice(2)}</span>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${Math.round(Math.abs(m.pnl)/maxPnl*100)}%;background:${m.pnl>=0?'#22c55e':'#ef4444'}"></div>
      </div>
      <span style="min-width:52px;text-align:right;color:${m.pnl>=0?'#22c55e':'#ef4444'}">${m.pnl>=0?'+':''}$${m.pnl.toFixed(0)}</span>
      <span style="min-width:40px;text-align:right;color:var(--text-dim)">${m.wins}W ${m.losses}L</span>
