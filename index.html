<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c0f">
<title>AI Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0c0f;--surface:#111318;--border:#1e2229;--gold:#f5c842;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b;--text:#e5e7eb;--dim:#6b7280;--muted:#4b5563;--mono:'DM Mono',monospace;--display:'Syne',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--display);padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-size:16px;font-weight:700}
.logo-sub{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:1px}
.badge{background:#1a1f0a;border:1px solid #3a4a10;color:#a3e635;font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--border)}
.tab{flex:1;padding:7px;font-size:11px;font-family:var(--mono);border:none;background:transparent;color:var(--dim);cursor:pointer;border-radius:7px;transition:all .2s}
.tab.active{background:var(--border);color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stat-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.stat-badge{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:99px}
.stat-num{font-size:28px;font-weight:500;font-family:var(--mono);line-height:1;margin-bottom:3px}
.stat-label{font-size:10px;color:var(--dim);font-family:var(--mono)}
.stat-div{height:1px;background:var(--border);margin:8px 0}
.stat-foot{font-size:10px;color:var(--muted);font-family:var(--mono)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.ptitle{font-size:10px;font-family:var(--mono);color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.trade-item{padding:10px 0;border-bottom:1px solid var(--border)}
.trade-item:last-child{border-bottom:none;padding-bottom:0}
.ttop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.buy{color:var(--green);font-weight:500;font-size:13px;font-family:var(--mono)}
.sell{color:var(--red);font-weight:500;font-size:13px;font-family:var(--mono)}
.pill{font-size:10px;padding:2px 7px;border-radius:3px;font-family:var(--mono)}
.p-exec{background:#052e16;color:var(--green);border:1px solid #166534}
.p-rej{background:#1f0707;color:#f87171;border:1px solid #7f1d1d}
.p-win{background:#052e16;color:var(--green);border:1px solid #166534}
.p-loss{background:#1f0707;color:#f87171;border:1px solid #7f1d1d}
.tdet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:10px;font-family:var(--mono);color:var(--dim)}
.tdet span{display:flex;flex-direction:column;gap:1px}
.tdet b{color:var(--text);font-weight:500}
.cbar{height:2px;border-radius:1px;background:var(--border);margin-top:6px}
.cfill{height:100%;border-radius:1px;background:var(--gold)}
.rr{font-size:10px;color:#f87171;background:#1f0707;padding:4px 8px;border-radius:3px;margin-top:6px;font-family:var(--mono)}
.cw{height:180px;margin-top:4px}
.cw-sm{height:120px;margin-top:4px}
.di{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:11px;font-family:var(--mono);border-bottom:1px solid var(--border)}
.di:last-child{border-bottom:none}
.dot{width:5px;height:5px;border-radius:50%;margin-top:4px;flex-shrink:0}
.lu{font-size:10px;color:var(--muted);font-family:var(--mono);text-align:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.hidden{display:none}
.bt-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;font-family:var(--mono)}
.bt-row:last-child{border-bottom:none}
.mbar{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:10px;font-family:var(--mono);border-bottom:1px solid var(--border)}
.mbar:last-child{border-bottom:none}
.bw{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bf{height:100%;border-radius:2px}
/* instrument selector */
.inst-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.inst-btn{padding:6px 4px;font-size:10px;font-family:var(--mono);border:1px solid var(--border);background:var(--surface);color:var(--dim);border-radius:7px;cursor:pointer;text-align:center;transition:all .2s}
.inst-btn.active{background:var(--border);color:var(--text);border-color:var(--muted)}
.inst-btn.profit{border-color:#166534}
.inst-btn.loss{border-color:#7f1d1d}
/* comparison table */
.cmp-row{display:grid;grid-template-columns:90px 1fr 60px 60px 55px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px;font-family:var(--mono)}
.cmp-row:last-child{border-bottom:none}
.ret-bar{height:6px;border-radius:3px}
</style>
</head>
<body>

<nav style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid #1e2229;position:sticky;top:0;background:#0a0c0f;z-index:50">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:28px;height:28px;background:#f5c842;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px">⚡</div>
    <span style="font-family:'Syne',sans-serif;font-size:15px;font-weight:600;color:#e5e7eb">AI Agents Company</span>
  </div>
  <div style="display:flex;gap:4px;background:#111318;padding:4px;border-radius:8px;border:1px solid #1e2229">
    <a href="agents.html" style="padding:6px 16px;border-radius:5px;font-size:11px;font-family:'DM Mono',monospace;color:#6b7280;text-decoration:none;transition:color .2s" onmouseover="this.style.color='#e5e7eb'" onmouseout="this.style.color=''">🤖 Agents</a>
    <span style="padding:6px 16px;border-radius:5px;font-size:11px;font-family:'DM Mono',monospace;background:#1e2229;color:#e5e7eb">📊 Dashboard</span>
  </div>
</nav>

<div class="header">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-text">AI Trading</div>
      <div class="logo-sub">10 instruments · phase 4 · eightcap</div>
    </div>
  </div>
  <span class="badge" id="mode-badge">● PAPER</span>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('live')">Live Trades</button>
  <button class="tab" onclick="switchTab('backtest')">Backtest 2Y</button>
</div>

<!-- LIVE -->
<div id="tab-live">
  <div class="stats-grid" id="live-stats"></div>
  <div class="panel"><div class="ptitle">trade log</div><div id="trade-list"></div></div>
  <div class="panel"><div class="ptitle">confidence per run</div><div class="cw"><canvas id="confChart"></canvas></div></div>
  <div class="panel"><div class="ptitle">latest debate</div><div id="debate-list"></div></div>
</div>

<!-- BACKTEST -->
<div id="tab-backtest" class="hidden">

  <!-- Comparison table -->
  <div class="panel">
    <div class="ptitle">ผลเปรียบเทียบทุก instrument — 2 ปี</div>
    <div class="cmp-row" style="color:var(--dim);font-size:10px;padding-bottom:6px">
      <div>instrument</div><div>return</div><div style="text-align:right">win%</div><div style="text-align:right">sharpe</div><div style="text-align:right">pnl</div>
    </div>
    <div id="cmp-list"></div>
  </div>

  <!-- Instrument selector -->
  <div class="panel">
    <div class="ptitle">ดูรายละเอียดแต่ละ instrument</div>
    <div class="inst-grid" id="inst-btns"></div>
  </div>

  <!-- Detail -->
  <div class="stats-grid" id="bt-stats"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
    <div class="panel" style="margin-bottom:0"><div class="ptitle">performance</div><div id="bt-perf"></div></div>
    <div class="panel" style="margin-bottom:0"><div class="ptitle">risk metrics</div><div id="bt-risk"></div></div>
  </div>
  <div class="panel"><div class="ptitle">equity curve</div><div class="cw"><canvas id="equityChart"></canvas></div></div>
  <div class="panel"><div class="ptitle">monthly P&L</div><div id="monthly-list"></div></div>
</div>

<div class="lu" id="last-update"></div>

8.59,997.03,976.89,1016.05,995.53,975.44,955.74,964.83,917.54,872.58],"equity_dates":["06-07","08-16","09-19","11-27","01-01","01-30","03-20","04-17","06-06","07-10","08-29","11-19","12-30","03-04","04-08"]}};

let charts = {}, selectedInst = 'XAUUSD';

// ---- Live tab ----
async function loadLive() {
  try {
    const res = await fetch('./paper_trades.json?t='+Date.now());
    if (!res.ok) throw new Error('Cannot load paper_trades.json');
    const T = await res.json();
    renderLive(T);
  } catch(e) {
    document.getElementById('trade-list').innerHTML='<div style="color:#f87171;font-size:11px;font-family:var(--mono)">'+e.message+'</div>';
  }
}

function sc(ibg,ic,bbg,bc,vc){return{ibg,ic,bbg,bc,vc}}
function renderLive(T) {
  if (!T.length) return;
  const exec=T.filter(t=>t.executed).length, rej=T.length-exec;
  const avgConf=Math.round(T.reduce((a,t)=>a+t.confidence,0)/T.length);
  const totalTok=T.reduce((a,t)=>a+(t.total_tokens||0),0);
  const sellCount=T.filter(t=>t.signal==='SELL').length;
  document.getElementById('mode-badge').textContent='● '+(T[T.length-1]?.mode||'paper').toUpperCase();

  const stats=[
    {icon:'⚡',label:'total runs',value:T.length,sub:'paper trade',...sc('#1a1a2e','#6b7280','#1e2229','#4b5563'),badge:'today'},
    {icon:'✓',label:'executed',value:exec,sub:'passed gate',...sc('#052e16','#22c55e','#052e16','#22c55e','#22c55e'),badge:Math.round(exec/T.length*100)+'%'},
    {icon:'✕',label:'rejected',value:rej,sub:'filtered',...sc('#1f0707','#ef4444','#1f0707','#ef4444','#ef4444'),badge:Math.round(rej/T.length*100)+'%'},
    {icon:'~',label:'avg conf',value:avgConf+'%',sub:'all runs',...sc('#2a1f05','#f59e0b','#2a1f05','#f59e0b','#f59e0b'),badge:'avg'},
    {icon:'#',label:'tokens',value:(totalTok/1000).toFixed(0)+'k',sub:'used',...sc('#0c1a2e','#3b82f6','#0c1a2e','#3b82f6','#3b82f6'),badge:'~$'+(totalTok*0.000003).toFixed(4)},
    {icon:'↓',label:'top signal',value:'SELL',sub:sellCount+'/'+T.length,...sc('#1a1a1a','#6b7280','#1e2229','#4b5563'),badge:sellCount+'/'+T.length},
  ];
  document.getElementById('live-stats').innerHTML=stats.map(s=>`<div class="stat-card"><div class="stat-top"><div class="stat-icon" style="background:${s.ibg};color:${s.ic};font-family:var(--mono)">${s.icon}</div><span class="stat-badge" style="background:${s.bbg};color:${s.bc}">${s.badge}</span></div><div class="stat-num" style="${s.vc?'color:'+s.vc:''}">${s.value}</div><div class="stat-label">${s.label}</div><div class="stat-div"></div><div class="stat-foot">${s.sub}</div></div>`).join('');

  document.getElementById('trade-list').innerHTML=[...T].reverse().map(t=>`<div class="trade-item"><div class="ttop"><div style="display:flex;align-items:center;gap:8px"><span class="${t.signal==='BUY'?'buy':'sell'}">${t.signal}</span><span style="font-size:10px;color:var(--dim);font-family:var(--mono)">${(t.timestamp||'').slice(0,16)} ${t.instrument||''}</span></div><span class="pill ${t.executed?'p-exec':'p-rej'}">${t.executed?'✓ EXEC':'✗ REJ'}</span></div><div class="tdet"><span>entry<b>${(t.entry||0).toFixed(2)}</b></span><span>SL<b style="color:#ef4444">${t.sl||'—'}</b></span><span>TP<b style="color:#22c55e">${t.tp||'—'}</b></span></div><div class="cbar"><div class="cfill" style="width:${t.confidence||0}%"></div></div>${!t.executed&&t.rejection_reasons?.length?`<div class="rr">${t.rejection_reasons[0]}</div>`:''}</div>`).join('');

  if (charts.conf) charts.conf.destroy();
  charts.conf=new Chart(document.getElementById('confChart'),{type:'bar',data:{labels:T.map((_,i)=>'#'+(i+1)),datasets:[{data:T.map(t=>t.confidence),backgroundColor:T.map(t=>t.executed?'#22c55e33':'#ef444433'),borderColor:T.map(t=>t.executed?'#22c55e':'#ef4444'),borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:10}}},y:{min:0,max:100,grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:10}}}}}});

  const latest=T[T.length-1];
  if(latest){
    document.getElementById('debate-list').innerHTML=[...(latest.bull_points||[]).map(p=>`<div class="di"><div class="dot" style="background:#22c55e"></div><div style="color:#86efac">${p}</div></div>`),...(latest.bear_points||[]).map(p=>`<div class="di"><div class="dot" style="background:#ef4444"></div><div style="color:#fca5a5">${p}</div></div>`)].join('')||'<div style="color:var(--dim);font-size:11px;font-family:var(--mono)">no data</div>';
  }
  document.getElementById('last-update').textContent='updated: '+new Date().toLocaleString('th-TH');
}

// ---- Backtest tab ----
function renderBtComparison() {
  const maxRet=Math.max(...Object.values(BT).map(b=>Math.abs(b.return_pct)));
  document.getElementById('cmp-list').innerHTML=Object.entries(BT).sort((a,b)=>b[1].return_pct-a[1].return_pct).map(([sym,b])=>{
    const isP=b.return_pct>=0;
    const barW=Math.round(Math.abs(b.return_pct)/maxRet*100);
    return `<div class="cmp-row"><div style="font-weight:500;color:${isP?'#22c55e':'#ef4444'}">${sym}</div><div><div class="ret-bar" style="width:${barW}%;background:${isP?'#22c55e':'#ef4444'};height:6px;border-radius:3px;margin-top:2px"></div><div style="font-size:9px;color:var(--dim);margin-top:2px">${b.total_trades} trades</div></div><div style="text-align:right;color:var(--dim)">${b.win_rate}%</div><div style="text-align:right;color:${b.sharpe>=1?'#22c55e':b.sharpe>=0?'#f59e0b':'#ef4444'}">${b.sharpe}</div><div style="text-align:right;color:${isP?'#22c55e':'#ef4444'}">${isP?'+':''}${b.return_pct}%</div></div>`;
  }).join('');
}

function renderBtInstrument(sym) {
  selectedInst=sym;
  document.querySelectorAll('.inst-btn').forEach(b=>b.classList.toggle('active',b.dataset.sym===sym));
  const b=BT[sym];
  const isP=b.return_pct>=0;

  const stats=[
    {icon:'↑',label:'return',value:b.return_pct+'%',sub:'2 years',...sc(isP?'#052e16':'#1f0707',isP?'#22c55e':'#ef4444',isP?'#052e16':'#1f0707',isP?'#22c55e':'#ef4444',isP?'#22c55e':'#ef4444'),badge:isP?'profit':'loss'},
    {icon:'%',label:'win rate',value:b.win_rate+'%',sub:b.total_trades+' trades',...sc('#2a1f05','#f59e0b','#2a1f05','#f59e0b','#f59e0b'),badge:'total'},
    {icon:'$',label:'total P&L',value:'$'+b.total_pnl,sub:'from $1,000',...sc(isP?'#052e16':'#1f0707',isP?'#22c55e':'#ef4444',isP?'#052e16':'#1f0707',isP?'#22c55e':'#ef4444',isP?'#22c55e':'#ef4444'),badge:'net'},
    {icon:'▼',label:'max drawdown',value:'$'+b.max_drawdown,sub:'worst dip',...sc('#1f0707','#ef4444','#1f0707','#ef4444','#ef4444'),badge:'dd'},
    {icon:'~',label:'profit factor',value:b.profit_factor,sub:'> 1.0 = good',...sc('#0c1a2e','#3b82f6','#0c1a2e','#3b82f6','#3b82f6'),badge:'pf'},
    {icon:'S',label:'sharpe',value:b.sharpe,sub:'> 1.0 = good',...sc('#1a1a2e','#6b7280','#1e2229','#4b5563'),badge:'sr'},
  ];
  document.getElementById('bt-stats').innerHTML=stats.map(s=>`<div class="stat-card"><div class="stat-top"><div class="stat-icon" style="background:${s.ibg};color:${s.ic};font-family:var(--mono)">${s.icon}</div><span class="stat-badge" style="background:${s.bbg};color:${s.bc}">${s.badge}</span></div><div class="stat-num" style="${s.vc?'color:'+s.vc:''}">${s.value}</div><div class="stat-label">${s.label}</div><div class="stat-div"></div><div class="stat-foot">${s.sub}</div></div>`).join('');

  document.getElementById('bt-perf').innerHTML=[['total trades',b.total_trades],['win rate',b.win_rate+'%'],['profit factor',b.profit_factor],['final balance','$'+b.final_balance],['best scenario','+$'+(b.total_pnl>0?b.total_pnl:0)]].map(([k,v])=>`<div class="bt-row"><span style="color:var(--dim)">${k}</span><span style="font-weight:500">${v}</span></div>`).join('');
  document.getElementById('bt-risk').innerHTML=[['max drawdown','$'+b.max_drawdown],['sharpe ratio',b.sharpe],['total P&L','$'+b.total_pnl],['return',b.return_pct+'%'],['status',isP?'✓ Profitable':'✗ Loss']].map(([k,v])=>`<div class="bt-row"><span style="color:var(--dim)">${k}</span><span style="font-weight:500;color:${k==='status'?(isP?'#22c55e':'#ef4444'):'var(--text)'}">${v}</span></div>`).join('');

  if(charts.equity) charts.equity.destroy();
  charts.equity=new Chart(document.getElementById('equityChart'),{type:'line',data:{labels:b.equity_dates,datasets:[{data:b.equity,borderColor:isP?'#f5c842':'#ef4444',borderWidth:1.5,pointRadius:0,fill:true,backgroundColor:isP?'rgba(245,200,66,0.05)':'rgba(239,68,68,0.05)',tension:0.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:9},maxTicksLimit:6}},y:{grid:{color:'#1e2229'},ticks:{color:'#4b5563',font:{family:'DM Mono',size:9},callback:v=>'$'+v}}}}});
}

function renderBacktest() {
  renderBtComparison();
  // Instrument buttons
  document.getElementById('inst-btns').innerHTML=Object.keys(BT).map(sym=>{
    const isP=BT[sym].return_pct>=0;
    return `<button class="inst-btn ${isP?'profit':'loss'} ${sym===selectedInst?'active':''}" data-sym="${sym}" onclick="renderBtInstrument('${sym}')">${sym}<div style="font-size:9px;margin-top:2px;color:${isP?'#22c55e':'#ef4444'}">${isP?'+':''}${BT[sym].return_pct}%</div></button>`;
  }).join('');
  renderBtInstrument(selectedInst);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='live')||(i===1&&tab==='backtest')));
  document.getElementById('tab-live').classList.toggle('hidden',tab!=='live');
  document.getElementById('tab-backtest').classList.toggle('hidden',tab!=='backtest');
  if(tab==='backtest') renderBacktest();
}

loadLive();
setInterval(loadLive,5*60*1000);
</script>
