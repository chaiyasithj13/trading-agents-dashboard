<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0e0a">
<title>AI Trading Team</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e0a;--surface:#1a1814;--border:#2a2820;
  --gold:#c9a84c;--gold-dim:#7a6421;--gold-light:#e8c87a;
  --text:#e8e4d8;--text-dim:#8a8474;--text-muted:#5a564a;
  --mono:'DM Mono',monospace;--serif:'Playfair Display',serif;--display:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--display);min-height:100vh;padding:0}

.noise{position:fixed;inset:0;pointer-events:none;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");z-index:100}

.header{padding:40px 32px 32px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.header-left{}
.eyebrow{font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
.headline{font-family:var(--display);font-size:clamp(32px,5vw,56px);font-weight:800;font-style:normal;line-height:1.15;color:var(--text);margin-bottom:8px}
.headline span{color:var(--gold);font-style:italic}
.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}
.meta-item{font-size:11px;font-family:var(--mono);color:var(--text-dim)}
.meta-item b{color:var(--text);margin-right:4px}

.header-right{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.toggle-btn{font-size:11px;font-family:var(--mono);padding:7px 14px;border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
.toggle-btn.active{background:var(--text);color:var(--bg);border:none}
.toggle-btn:not(.active){background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.back-btn{font-size:11px;font-family:var(--mono);padding:7px 14px;border-radius:4px;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;background:transparent;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.back-btn:hover{color:var(--text);border-color:var(--text-muted)}

.filters{padding:16px 32px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.filter-pill{font-size:11px;font-family:var(--mono);padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.filter-pill::before{content:'';width:6px;height:6px;border-radius:50%}
.filter-pill[data-cat="all"]::before{background:var(--text-dim)}
.filter-pill[data-cat="orchestrator"]::before{background:#c9a84c}
.filter-pill[data-cat="analyst"]::before{background:#5b9bd5}
.filter-pill[data-cat="manager"]::before{background:#7c6fcd}
.filter-pill[data-cat="gate"]::before{background:#e07b5a}
.filter-pill[data-cat="trader"]::before{background:#5cad7e}
.filter-pill.active{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.filter-pill:not(.active){background:transparent;color:var(--text-dim);border:1px solid transparent}

/* GRID */
.grid-view{padding:32px}
.agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}

.agent-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .25s;position:relative}
.agent-card:hover{border-color:var(--text-muted);transform:translateY(-2px)}

.card-image{width:100%;aspect-ratio:3/4;position:relative;overflow:hidden}
.agent-avatar{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative}
.avatar-bg{position:absolute;inset:0}
.avatar-emoji{position:relative;z-index:1;font-size:72px;filter:drop-shadow(0 4px 24px rgba(0,0,0,0.5))}

.card-num{position:absolute;top:10px;left:10px;font-size:10px;font-family:var(--mono);color:var(--text-dim);background:rgba(0,0,0,0.6);padding:3px 8px;border-radius:3px;backdrop-filter:blur(4px)}
.card-cat-badge{position:absolute;top:10px;right:10px;font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:3px}

.card-body{padding:14px 16px 16px}
.card-name{font-size:18px;font-weight:700;font-family:'Spectral',serif;font-style:italic;color:var(--text);margin-bottom:4px}
.card-role{font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.card-desc{font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:12px}
.card-tools{display:flex;gap:6px;flex-wrap:wrap}
.tool-tag{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:3px;background:rgba(255,255,255,0.05);color:var(--text-muted);border:1px solid var(--border)}

/* PIPELINE VIEW */
.pipeline-view{padding:32px;display:none}
.pipeline-line{display:flex;flex-direction:column;gap:0;max-width:680px;margin:0 auto}
.pipe-step{display:flex;gap:20px;align-items:stretch}
.pipe-left{display:flex;flex-direction:column;align-items:center;width:48px;flex-shrink:0}
.pipe-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pipe-connector{flex:1;width:1px;background:var(--border);margin:4px 0}
.pipe-step:last-child .pipe-connector{display:none}
.pipe-content{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;flex:1;margin-bottom:16px}
.pipe-name{font-size:15px;font-weight:700;font-family:'Spectral',serif;font-style:italic;color:var(--text);margin-bottom:2px}
.pipe-role{font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.pipe-desc{font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:10px}
.pipe-arrow{font-size:10px;font-family:var(--mono);color:var(--text-muted);padding:3px 10px;background:rgba(255,255,255,0.04);border-radius:3px;display:inline-flex;align-items:center;gap:6px}

/* Category colors */
.cat-orchestrator{background:#3d2e0a;color:#c9a84c;border-color:#5a4415}
.cat-analyst{background:#0a1e35;color:#5b9bd5;border-color:#1a3a5a}
.cat-manager{background:#1a1535;color:#7c6fcd;border-color:#302870}
.cat-gate{background:#3d1a0a;color:#e07b5a;border-color:#5a2a15}
.cat-trader{background:#0a2d1a;color:#5cad7e;border-color:#155a30}

.pipe-circle.cat-orchestrator{background:#3d2e0a}
.pipe-circle.cat-analyst{background:#0a1e35}
.pipe-circle.cat-manager{background:#1a1535}
.pipe-circle.cat-gate{background:#3d1a0a}
.pipe-circle.cat-trader{background:#0a2d1a}

.footer-bar{padding:20px 32px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-stat{font-size:11px;font-family:var(--mono);color:var(--text-dim)}
.footer-stat b{color:var(--text)}
</style>

<body>

<div class="noise"></div>

<div class="header">
  <div class="header-left">
    <div class="eyebrow">creator team credits</div>
    <h1 class="headline">AI Agents<br><span>Company</span></h1>
    <div class="meta">
      <div class="meta-item"><b>6</b> team members</div>
      <div class="meta-item"><b>1</b> pipeline</div>
      <div class="meta-item"><b>10</b> instruments</div>
      <div class="meta-item"><b>0</b> humans harmed</div>
    </div>
  </div>
  <div class="header-right">
    <a class="back-btn" href="index.html">← dashboard</a>
    <button class="toggle-btn active" id="btn-grid" onclick="setView('grid')">Team grid</button>
    <button class="toggle-btn" id="btn-pipe" onclick="setView('pipeline')">Pipeline flow</button>
  </div>
</div>

<div class="filters" id="filters">
  <button class="filter-pill active" data-cat="all" onclick="filterCat('all')">All</button>
  <button class="filter-pill" data-cat="orchestrator" onclick="filterCat('orchestrator')">Orchestrator</button>
  <button class="filter-pill" data-cat="analyst" onclick="filterCat('analyst')">Analyst</button>
  <button class="filter-pill" data-cat="manager" onclick="filterCat('manager')">Manager</button>
  <button class="filter-pill" data-cat="gate" onclick="filterCat('gate')">Quality Gate</button>
  <button class="filter-pill" data-cat="trader" onclick="filterCat('trader')">Trader</button>
</div>

<!-- GRID VIEW -->
<div class="grid-view" id="view-grid">
  <div class="agents-grid" id="agents-grid"></div>
</div>

<!-- PIPELINE VIEW -->
<div class="pipeline-view" id="view-pipeline">
  <div class="pipeline-line" id="pipeline-line"></div>
</div>

<div class="footer-bar">
  <div class="footer-stat">XAUUSD · XAGUSD · USOIL · EURUSD · GBPUSD · USDJPY · AUDUSD · USDCAD · USDCHF · EURJPY</div>
  <div class="footer-stat"><b>Phase 4</b> · Eightcap · MT5</div>
</div>

function renderGrid(agents) {
  document.getElementById('agents-grid').innerHTML = agents.map((a,i) => `
    <div class="agent-card" data-cat="${a.cat}">
      <div class="card-image">
        <div class="avatar-bg" style="background:radial-gradient(ellipse at 50% 70%, ${a.colors[1]} 0%, ${a.colors[0]} 70%)"></div>
        ${AGENT_IMGS[a.name] ? `<img src="${AGENT_IMGS[a.name]}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;opacity:0.92" alt="${a.name}">` : `<div class="avatar-emoji">${a.emoji}</div>`}
        <div class="card-num">${a.num}</div>
        <div class="card-cat-badge cat-${a.cat}">${a.catLabel}</div>
      </div>
      <div class="card-body">
        <div class="card-name" style="display:flex;align-items:center;gap:8px">
          <div style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${a.iconBg}">
            <i class="ti ${a.icon}" style="font-size:14px;color:${a.iconColor}" aria-hidden="true"></i>
          </div>
          ${a.name}
        </div>
        <div class="card-role">— ${a.role}</div>
        <div class="card-desc">${a.desc}</div>
        <div class="card-tools">${a.tools.map(t=>`<span class="tool-tag">${t}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

function renderPipeline() {
  document.getElementById('pipeline-line').innerHTML = AGENTS.map((a,i) => `
    <div class="pipe-step">
      <div class="pipe-left">
        <div class="pipe-circle cat-${a.cat}" style="overflow:hidden;${AGENT_IMGS[a.name]?'padding:0':''}">
          ${AGENT_IMGS[a.name] ? `<img src="${AGENT_IMGS[a.name]}" style="width:100%;height:100%;object-fit:cover;object-position:top center" alt="${a.name}">` : a.emoji}
        </div>
        <div class="pipe-connector"></div>
      </div>
      <div class="pipe-content">
        <div class="pipe-name" style="display:flex;align-items:center;gap:8px">
          <div style="width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${a.iconBg}">
            <i class="ti ${a.icon}" style="font-size:13px;color:${a.iconColor}" aria-hidden="true"></i>
          </div>
          ${a.name}
        </div>
        <div class="pipe-role">— ${a.role}</div>
        <div class="pipe-desc">${a.desc}</div>
        <span class="pipe-arrow">${a.output}</span>
      </div>
    </div>`).join('');
}

function filterCat(cat) {
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
  const filtered = cat === 'all' ? AGENTS : AGENTS.filter(a => a.cat === cat);
  renderGrid(filtered);
}

function setView(v) {
  document.getElementById('view-grid').style.display = v==='grid' ? 'block' : 'none';
  document.getElementById('view-pipeline').style.display = v==='pipeline' ? 'block' : 'none';
  document.getElementById('filters').style.display = v==='grid' ? 'flex' : 'none';
  document.getElementById('btn-grid').className = 'toggle-btn' + (v==='grid'?' active':'');
  document.getElementById('btn-pipe').className = 'toggle-btn' + (v==='pipeline'?' active':'');
  if (v==='pipeline') renderPipeline();
}
